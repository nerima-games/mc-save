name: CI

on:
  push:
    branches: [main]
  pull_request:

# These are public repositories, so a fork PR runs this workflow. Nothing here
# needs write access, and an unset block inherits an org default that is not
# managed in Terraform.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # Full history, not just the default shallow clone: the changeset
          # status check below diffs the PR branch against `origin/main`.
          fetch-depth: 0

      - name: Setup pnpm
        # Pinned to a commit, not the mutable v4 tag: this is a third-party action
        # and a tag can be repointed at new code without any change here.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        # --ignore-scripts: pnpm runs postinstall, and a fork PR can edit
        # package.json and the lockfile consistently and still satisfy
        # --frozen-lockfile. Nothing here needs a lifecycle script.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: pnpm typecheck

      # oxlint is provided by the Nix devShell (flake.nix), not a package.json
      # devDependency — see flake.nix's comment on why. Installing Nix just for
      # this one step is the org-wide trade-off (DEPENDENCY_POLICY.md §5
      # "前提条件"): one pinned oxlint version instead of 16 repos each
      # independently drifting on their own npm-resolved version.
      - name: Set up Nix
        uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Lint
        run: nix develop --command pnpm lint

      - name: Test
        run: pnpm test

      # RELEASE_STANDARD.md §1.2: catch a user-facing PR that forgot to add a
      # changeset. Only meaningful on a PR (there is nothing to diff against on
      # a push to main itself). Not a perfect filter — a docs-only or
      # CI-only PR will also be flagged — so treat a failure here as a prompt
      # to run `pnpm changeset` (or confirm the change truly needs none),
      # rather than as an unconditional hard requirement.
      - name: Changeset status
        if: github.event_name == 'pull_request'
        run: pnpm changeset status --since=main

      # Hard gate (TEST_STANDARD.md §3): statements/branches/functions/lines
      # all at 99%, enforced by `vitest run --coverage` itself via
      # `vitest.config.ts#test.coverage.thresholds`. Kept as a separate step
      # from `pnpm verify` rather than folded into it, so the fast gate stays
      # fast and the coverage report is still produced (and uploaded below)
      # even when this step fails.
      - name: Coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage
          path: coverage/
          retention-days: 7
