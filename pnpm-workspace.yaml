allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@nerima-games/mc-kernel@0.8.0 || 0.9.0'

overrides:
  # GHSA-2v37-7h3g-55p8: nanoid's custom generator can loop indefinitely when
  # size is zero. Pulled in transitively via
  # @vitest/browser-playwright > @vitest/browser|vitest > vite > postcss > nanoid
  # (`pnpm why nanoid`, 20 paths). No direct dependency on nanoid exists.
  nanoid: ">=3.3.18"
  # Pin audited transitives to patched versions until upstream ranges include them.
  vite: 7.3.7
  '@vitest/mocker': 4.1.12
  source-map-js: 1.2.2
  launch-editor: 2.14.2
  shell-quote: 1.11.0
